[theme]
# Το βασικό χρώμα (π.χ. για τα primary κουμπιά) - Το κάνουμε Μωβ αντί για κόκκινο!
primaryColor = "#8b5cf6"

# Το χρώμα του φόντου (Σκούρο γκρι/μαύρο)
backgroundColor = "#0e1117"

# Το χρώμα για τα πλαίσια και την πλευρική μπάρα (Sidebar)
secondaryBackgroundColor = "#1c1c1e"

# Το βασικό χρώμα του κειμένου
textColor = "#e5e5e5"

# Γραμματοσειρά
font = "sans serif"